# Empacotamento do FMA para as três plataformas (Decisão - App Desktop com Electron).
appId: dev.luizkirsch.fma
productName: FMA
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json

win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
