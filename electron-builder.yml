# Empacotamento do FMA para as três plataformas (Decisão - App Desktop com Electron).
appId: dev.luizkirsch.fma
productName: FMA
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json

win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development

# Auto-update: o app instalado confere os releases deste repositório (público). Publicar: npm run release.
publish:
  provider: github
  owner: LuizKirsch
  repo: fma
  releaseType: release
